<!DOCTYPE html>
<html lang="es" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pecuaria</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pecuaria">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================== TEMA · "Campo al amanecer" =====================
   60 % base (crema)  ·  30 % secundario (verde bosque)  ·  10 % acento (yema)
   ===================================================================== */
:root{
  /* 60 — base */
  --bg:#F6F1E7; --bg-outer:#E9E1D1; --surface:#FFFDF8; --surface2:#EFE8DA; --outline:#E4DACA;
  --text:#1E2A22; --muted:#6B6A5E;
  /* 30 — secundario */
  --primary:#1F4D3A; --primary-2:#2A6149; --on-primary:#F6F1E7; --primary-soft:#DCE8DF;
  /* 10 — acento */
  --accent:#E8A33D; --on-accent:#2F1E02; --accent-soft:#FBEBD0; --accent-ink:#9A6210;
  /* semánticos */
  --danger:#B23A2E; --danger-soft:#F8E1DC; --warn:#8E5A06; --warn-soft:#F8EAD1; --ok:#2F6B4A; --ok-soft:#DDEDE2;
  /* especies (acentos suaves) */
  --c-gallina:#B8702A; --c-vaca:#2F7A55; --c-oveja:#5A73A0; --c-venta:#8B5A86;
  --hill1:#2A6149; --hill2:#1F4D3A; --hill3:#173B2C; --sun:#E8A33D;
  --shadow:0 1px 2px rgba(31,77,58,.06),0 6px 18px rgba(31,77,58,.07);
  --shadow-lg:0 10px 30px rgba(20,40,30,.18);
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1); --ease-bounce:cubic-bezier(.34,1.4,.64,1);
  --f-display:Nunito,ui-rounded,system-ui,sans-serif; --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){ html[data-theme="auto"]{ color-scheme:dark;
  --bg:#0F1B15; --bg-outer:#09110D; --surface:#16251D; --surface2:#1E3027; --outline:#2A3F33;
  --text:#F1EBDD; --muted:#A9B3A6;
  --primary:#9ED1B2; --primary-2:#1D3A2D; --on-primary:#0F1B15; --primary-soft:#1F3A2C;
  --accent:#F2B552; --on-accent:#2A1A00; --accent-soft:#3A2C12; --accent-ink:#F7C77A;
  --danger:#F2A69B; --danger-soft:#43211C; --warn:#F5C77E; --warn-soft:#3A2C12; --ok:#9ED1B2; --ok-soft:#1F3A2C;
  --c-gallina:#E2A367; --c-vaca:#86CFA6; --c-oveja:#A5B8E0; --c-venta:#D2A6CE;
  --hill1:#1F4434; --hill2:#183629; --hill3:#112A1F; --sun:#F2B552;
  --shadow:0 1px 0 rgba(255,255,255,.03); --shadow-lg:0 10px 30px rgba(0,0,0,.5); }}
html[data-theme="dark"]{ color-scheme:dark;
  --bg:#0F1B15; --bg-outer:#09110D; --surface:#16251D; --surface2:#1E3027; --outline:#2A3F33;
  --text:#F1EBDD; --muted:#A9B3A6;
  --primary:#9ED1B2; --primary-2:#1D3A2D; --on-primary:#0F1B15; --primary-soft:#1F3A2C;
  --accent:#F2B552; --on-accent:#2A1A00; --accent-soft:#3A2C12; --accent-ink:#F7C77A;
  --danger:#F2A69B; --danger-soft:#43211C; --warn:#F5C77E; --warn-soft:#3A2C12; --ok:#9ED1B2; --ok-soft:#1F3A2C;
  --c-gallina:#E2A367; --c-vaca:#86CFA6; --c-oveja:#A5B8E0; --c-venta:#D2A6CE;
  --hill1:#1F4434; --hill2:#183629; --hill3:#112A1F; --sun:#F2B552;
  --shadow:0 1px 0 rgba(255,255,255,.03); --shadow-lg:0 10px 30px rgba(0,0,0,.5); }
/* En modo oscuro, el verde "estructural" (barras, encabezados) se mantiene profundo */
:root{ --band:#1F4D3A; --on-band:#F6F1E7; --band-muted:rgba(246,241,231,.72); }
@media (prefers-color-scheme:dark){ html[data-theme="auto"]{ --band:#173226; --on-band:#F1EBDD; } }
html[data-theme="dark"]{ --band:#173226; --on-band:#F1EBDD; }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg-outer);color:var(--text);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow-x:hidden}
@media (min-width:480px){ .app{box-shadow:0 0 0 1px var(--outline),0 20px 60px rgba(0,0,0,.08)} }
h1,h2,h3,.dtitle,.stat .v,.hubcard .t,.hubcard .big b,.tile .cnt,.num{font-family:var(--f-display)}

/* ---------- Encabezado ilustrado (pantallas principales) ---------- */
.herotop{position:relative;background:var(--band);color:var(--on-band);padding:18px 18px 64px;overflow:hidden;border-radius:0 0 28px 28px}
.scene{position:absolute;left:0;right:0;bottom:-1px;height:96px;pointer-events:none}
.scene svg{position:absolute;bottom:0;overflow:visible}
.scene .hills{left:0;width:100%;height:100%}
.scene .extra{left:4%;height:100%;width:160px}
.scene .sol{right:12%;bottom:34px;width:64px;height:64px}
.herotop .row1{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.herotop .kicker{font-size:13px;color:var(--band-muted);letter-spacing:.2px}
.herotop h1{margin:2px 0 0;font-size:30px;font-weight:900;letter-spacing:-.4px;line-height:1.1;position:relative;z-index:1}
.herotop h1 em{font-style:normal;color:var(--sun)}
.herotop .iconbtn{color:var(--on-band);margin-left:auto;background:rgba(255,255,255,.08)}
.herotop .iconbtn:hover{background:rgba(255,255,255,.16)}
.herotop + .content{margin-top:-38px;position:relative;z-index:2}

/* Barra superior de sub-pantallas */
.topbar{position:sticky;top:0;z-index:20;background:var(--band);color:var(--on-band);display:flex;align-items:center;gap:4px;padding:10px 8px 10px 8px;min-height:62px;transition:box-shadow .2s}
.topbar.scrolled{box-shadow:0 4px 16px rgba(0,0,0,.18)}
.topbar h1{font-size:20px;font-weight:800;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
.topbar h1 .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:rgba(255,255,255,.12)}
.topbar .sub{display:block;font-size:12px;color:var(--band-muted);font-weight:400;font-family:var(--f-body)}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:14px;display:grid;place-items:center;cursor:pointer;color:inherit;flex:none;transition:background .15s,transform .15s}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:24px;height:24px}

.content{padding:16px 16px 120px;flex:1}
.section-title{font-family:var(--f-display);font-size:17px;font-weight:800;color:var(--text);margin:26px 4px 12px;display:flex;align-items:center;gap:8px}
.section-title small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);margin-left:auto}

/* ---------- Barra inferior (30 %) con indicador en acento (10 %) ---------- */
.bottomnav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(416px,calc(100% - 24px));background:var(--band);border-radius:24px;display:flex;z-index:30;padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg)}
.navitem{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--band-muted);cursor:pointer;padding:2px 0;font-weight:500}
.navitem .pill{width:52px;height:32px;border-radius:12px;display:grid;place-items:center;transition:background .25s var(--ease),transform .25s var(--ease-bounce)}
.navitem svg{width:23px;height:23px}
.navitem.on{color:var(--on-band)}
.navitem.on .pill{background:var(--accent);color:var(--on-accent);transform:translateY(-1px)}
.navitem:active .pill{transform:scale(.9)}

/* ---------- Tarjetas y métricas ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--outline)}
.pad{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px 15px;border-radius:var(--r);background:var(--surface);border:1px solid var(--outline);box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .v{font-size:25px;font-weight:900;line-height:1.1;color:var(--primary);letter-spacing:-.3px}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.stat.accent .v{color:var(--ac,var(--primary))}
.stat.accent::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--ac,var(--primary));opacity:.85}
.stat.feature{grid-column:1/-1;background:var(--band);border:0;color:var(--on-band);padding:18px 18px 16px;display:flex;align-items:flex-end;gap:12px}
.stat.feature::before{display:none}
.stat.feature .v{color:var(--sun);font-size:40px}
.stat.feature .l{color:var(--band-muted);font-size:13px}
.stat.feature .side{margin-left:auto;text-align:right;font-size:13px;color:var(--band-muted)}
.stat.feature .side b{display:block;color:var(--on-band);font-family:var(--f-display);font-size:20px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .stat{min-width:118px;flex:1}

/* ---------- Hub de especies ---------- */
.hub{display:flex;flex-direction:column;gap:14px}
.hubcard{position:relative;display:flex;align-items:center;gap:14px;padding:18px;border-radius:24px;cursor:pointer;border:1px solid var(--outline);background:var(--surface);text-align:left;width:100%;box-shadow:var(--shadow);overflow:hidden;transition:transform .18s var(--ease),box-shadow .18s}
.hubcard::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:color-mix(in srgb,var(--ac) 12%,transparent);transition:transform .4s var(--ease)}
.hubcard:hover::after{transform:scale(1.15)}
.hubcard:active{transform:scale(.98)}
.hubcard .emo{font-size:36px;width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 16%,var(--surface));flex:none;position:relative;z-index:1}
.hubcard .t{font-size:21px;font-weight:900;position:relative;z-index:1}
.hubcard .m{font-size:13px;color:var(--muted);margin-top:3px;position:relative;z-index:1}
.hubcard .big{margin-left:auto;text-align:right;position:relative;z-index:1}
.hubcard .big b{display:block;font-size:30px;font-weight:900;color:var(--ac)}
.hubcard .big span{font-size:11px;color:var(--muted)}
.hubcard .go{position:absolute;right:16px;bottom:12px;color:var(--muted);opacity:.5}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--outline);cursor:pointer;text-align:left;min-height:132px;box-shadow:var(--shadow);transition:transform .18s var(--ease),border-color .2s}
.tile:hover{border-color:color-mix(in srgb,var(--ac) 50%,var(--outline))}
.tile:active{transform:scale(.97)}
.tile .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 15%,var(--surface));font-size:22px}
.tile .n{font-weight:700;font-family:var(--f-display);font-size:16px}
.tile .c{font-size:12px;color:var(--muted);margin-top:2px}
.tile .cnt{font-size:24px;font-weight:900;color:var(--ac);margin-top:auto}

/* ---------- Listas ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--outline);border-radius:var(--r);cursor:pointer;text-align:left;width:100%;transition:transform .15s var(--ease),background .15s}
.row:hover{background:color-mix(in srgb,var(--surface2) 45%,var(--surface))}
.row:active{transform:scale(.985)}
.av{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;font-size:21px;font-weight:800;font-family:var(--f-display);background:color-mix(in srgb,var(--ac,var(--primary)) 14%,var(--surface));color:var(--ac,var(--primary));overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av svg{width:22px;height:22px}
.row .tx{flex:1;min-width:0}
.row .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;flex:none;font-size:12px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .rt b{display:block;font-size:15px;font-family:var(--f-display);font-weight:800}

.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--danger-soft);color:var(--danger)}
.badge.info{background:var(--primary-soft);color:var(--primary)}
.badge.hot{background:var(--accent);color:var(--on-accent)}

/* ---------- Búsqueda, chips, segmentado ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--outline);border-radius:18px;padding:0 16px;height:52px;margin:4px 0 12px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.search svg{width:22px;height:22px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;outline:0;flex:1;height:100%;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;padding:1px}
.chip{border:1px solid var(--outline);background:var(--surface);border-radius:999px;padding:8px 15px;font-size:13.5px;cursor:pointer;white-space:nowrap;font-weight:500;transition:all .2s var(--ease)}
.chip.on{background:var(--band);border-color:var(--band);color:var(--on-band)}
.seg{display:flex;background:var(--surface2);border-radius:16px;padding:4px;margin:4px 0 14px;position:relative}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:10px;cursor:pointer;font-weight:600;color:var(--muted);transition:all .2s var(--ease)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* ---------- Alertas ---------- */
.alert{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:16px;cursor:pointer;border:1px solid transparent;width:100%;text-align:left;margin-bottom:8px;transition:transform .15s var(--ease)}
.alert:active{transform:scale(.985)}
.alert .ai{font-size:20px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.45);flex:none}
.alert b{display:block;font-weight:600}
.alert span{font-size:13px;opacity:.85}
.alert.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 18%,transparent)}
.alert.bad{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 18%,transparent)}
.alert.info{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 18%,transparent)}
html[data-theme="dark"] .alert .ai{background:rgba(0,0,0,.2)}

/* ---------- Botones ---------- */
.btn{border:0;border-radius:16px;padding:13px 20px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:transform .15s var(--ease),filter .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.fill{background:var(--accent);color:var(--on-accent)}
.btn.fill:hover{filter:brightness(1.04)}
.btn.tonal{background:var(--primary-soft);color:var(--primary)}
.btn.out{background:transparent;border:1px solid var(--outline)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{border:1px solid var(--outline);background:var(--surface);border-radius:18px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s var(--ease)}
.quick button:active{transform:scale(.95)}
.quick button span{font-size:22px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft)}

.fab{position:fixed;bottom:104px;right:max(20px,calc(50% - 200px));width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent);cursor:pointer;display:grid;place-items:center;z-index:25;transition:transform .2s var(--ease-bounce)}
.fab:hover{transform:rotate(90deg)}
.fab:active{transform:scale(.9)}
.fab svg{width:28px;height:28px}

/* ---------- Ficha de detalle ---------- */
.hero{height:220px;border-radius:26px;overflow:hidden;position:relative;background:color-mix(in srgb,var(--ac) 14%,var(--surface));display:grid;place-items:center;font-size:96px;box-shadow:var(--shadow)}
.hero .scene{height:90px}
.hero .big-emo{position:relative;z-index:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.15))}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.hero .ph{position:absolute;right:12px;top:12px;z-index:3}
.hero label{background:rgba(20,30,24,.62);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.hero label svg{width:18px;height:18px}
.hero input{display:none}
.dtitle{margin:18px 2px 8px;font-size:28px;font-weight:900;letter-spacing:-.4px}
.dsub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--surface);padding:12px 14px;border-radius:14px;border:1px solid var(--outline)}
.kv small{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.kv span{font-weight:600}
.kv .full{grid-column:1/-1}
.rel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.relcard{padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--outline);display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;transition:transform .15s var(--ease)}
.relcard:active{transform:scale(.97)}
.relcard.none{opacity:.55;cursor:default}
.relcard small{display:block;color:var(--muted);font-size:11px}
.relcard b{font-family:var(--f-display);font-weight:800}
.steps{display:flex;gap:4px;margin:10px 0 10px;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2)}
.steps div{height:100%;background:transparent}
.steps div.on{background:linear-gradient(90deg,var(--ac,var(--primary)),color-mix(in srgb,var(--ac,var(--primary)) 70%,var(--accent)));border-radius:5px;transform-origin:left;animation:grow .8s var(--ease) both}

/* ---------- Gráficas ---------- */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) .1s forwards}
.chart .ar{opacity:0;animation:fade .8s ease .5s forwards}
.chart .pt{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .4s var(--ease-bounce) 1s forwards}
.bars{display:flex;flex-direction:column;gap:12px}
.bar .bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar .bl span:last-child{font-weight:700;font-family:var(--f-display)}
.bar .bt{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar .bf{height:100%;border-radius:6px;background:var(--ac,var(--primary));transform-origin:left;animation:grow .9s var(--ease) both}
.bar:nth-child(2) .bf{animation-delay:.06s}.bar:nth-child(3) .bf{animation-delay:.12s}.bar:nth-child(4) .bf{animation-delay:.18s}.bar:nth-child(5) .bf{animation-delay:.24s}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend b{color:var(--text);font-family:var(--f-display)}

.empty .e{font-size:44px;margin:0 auto 12px;width:88px;height:88px;border-radius:28px;display:grid;place-items:center;background:var(--accent-soft)}

.scrim{position:fixed;inset:0;background:rgba(15,27,21,.5);backdrop-filter:blur(2px);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;width:min(440px,100%);transform:translate(-50%,105%);background:var(--surface);border-radius:30px 30px 0 0;z-index:60;max-height:92vh;display:flex;flex-direction:column;transition:transform .32s var(--ease),visibility 0s .32s;visibility:hidden}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .42s var(--ease-bounce)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--outline);margin:10px auto 2px}
.sheet h2{margin:8px 22px 4px;font-size:22px;font-weight:900}
.sheet .body{overflow-y:auto;padding:8px 22px 12px}
.sheet .foot{padding:12px 22px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--outline);display:flex;gap:10px}
.sheet .foot .btn{flex:1}
.field{margin:14px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 4px;font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--outline);background:var(--bg);border-radius:14px;padding:12px 14px;font-size:16px;outline:0;min-height:50px;transition:border-color .2s,box-shadow .2s}

.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.field .err{color:var(--danger);font-size:12px;margin:4px 4px 0;display:none}
.field.bad input,.field.bad select{border-color:var(--danger);animation:shake .35s}
.field.bad .err{display:block}
.formerr{background:var(--danger-soft);color:var(--danger);border-radius:14px;padding:11px 13px;font-size:14px;margin-top:8px;display:none;animation:shake .35s}
.hint{font-size:12px;color:var(--muted);margin:5px 4px 0}

/* ---------- Diálogo ---------- */
.dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%) scale(.94);opacity:0;pointer-events:none;background:var(--surface);border-radius:28px;padding:24px;width:min(340px,90vw);z-index:70;transition:all .25s var(--ease-bounce);box-shadow:var(--shadow-lg)}
.dialog.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dialog h3{margin:0 0 8px;font-size:21px;font-weight:900}
.dialog p{margin:0 0 20px;color:var(--muted);line-height:1.5}
.dialog .btnrow{justify-content:flex-end}
.dialog .btnrow .btn{flex:none}

/* ---------- Snackbar ---------- */
.snack{position:fixed;left:50%;bottom:178px;transform:translate(-50%,16px) scale(.96);background:var(--band);color:var(--on-band);padding:14px 18px;border-radius:16px;font-size:14px;font-weight:500;z-index:80;opacity:0;pointer-events:none;transition:all .3s var(--ease-bounce);width:min(400px,calc(100% - 32px));box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px}
.snack::before{content:"✓";width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.snack.on{opacity:1;transform:translate(-50%,0) scale(1)}
.snack.err{background:var(--danger);color:#fff}
.snack.err::before{content:"!";background:#fff;color:var(--danger)}

.login{min-height:100vh;display:flex;flex-direction:column}
.login .herotop{padding:56px 24px 110px;text-align:center;border-radius:0 0 36px 36px}

.login .logo{font-size:44px;position:relative;z-index:1;margin-bottom:6px}
.login .rolelist{display:flex;flex-direction:column;gap:10px;padding:0 20px;margin-top:-56px;position:relative;z-index:2}

.anim-in{animation:in .42s var(--ease) both}
.quieto .anim-in{animation:none}
.quieto #lista .anim-in{animation:in .3s var(--ease) both}
.page{animation:page .35s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes page{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes pop{to{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.scene .sol{animation:sway 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important} .chart .ln{stroke-dashoffset:0} }

.muted{color:var(--muted)}
.mt{margin-top:12px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:28px 0 0;line-height:1.5}

.syncpill{border:0;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 6px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);color:var(--on-band);cursor:pointer;white-space:nowrap;max-width:190px;flex:none;font-family:var(--f-body)}
.syncpill .tx{overflow:hidden;text-overflow:ellipsis}
.syncpill .si{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(255,255,255,.18);flex:none}
.syncpill.ok .si{background:var(--ok-soft);color:var(--ok)}
.syncpill.pend .si{background:var(--accent);color:var(--on-accent)}
.syncpill.off .si{background:rgba(255,255,255,.25)}
.syncpill.err{background:var(--danger)}
.syncpill.err .si{background:#fff;color:var(--danger)}
.syncpill.gira .si{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.topbar .syncpill{padding:0 6px}
.topbar .syncpill .tx{display:none}
.herotop .kicker{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.herotop .iconbtn{margin-left:0}
.card .syncpill{background:var(--surface2);color:var(--text);max-width:none}
.card .syncpill.err{background:var(--danger-soft);color:var(--danger)}
.btn:disabled{opacity:.6;cursor:wait}

// =====================================================================
//  ALMACENAMIENTO OFFLINE + SINCRONIZACIÓN CON GITHUB
//  - Todo se guarda primero en el teléfono (IndexedDB).
//  - Cada registro lleva _mod (marca de tiempo del último cambio).
//  - Los borrados se guardan como "lápidas" en DB._borrados para que
//    no reaparezcan al fusionar con otro dispositivo.
//  - Datos: datos.json en un repo privado. Fotos: fotos/<id>.jpg.
// =====================================================================
const LS = 'pecuaria-web-demo-v1';               // clave antigua (migración)
let DB, CFG;
const META = { gh:null, sha:'', ultima:0, sucio:false, cambios:0, rol:'' };

// ---------- IndexedDB mínimo (con respaldo en memoria si no existe) ----------
const IDB = (() => {
  let dbp = null; const mem = {kv:new Map(), fotos:new Map()};
  function abrir(){
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try {
        const r = indexedDB.open('pecuaria', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('fotos'); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch(e){ res(null); }
    });
    return dbp;
  }
  async function op(store, modo, fn){
    const db = await abrir();
    if (!db){ const r = fn(null, mem[store]); return r?.result; }
    return new Promise((res, rej) => {
      const tx = db.transaction(store, modo); const st = tx.objectStore(store);
      const req = fn(st); tx.oncomplete = () => res(req?.result); tx.onerror = () => rej(tx.error);
    });
  }
  return {
    get:(s,k)=>op(s,'readonly',(st,m)=> st ? st.get(k) : {result:m.get(k)}),
    set:(s,k,v)=>op(s,'readwrite',(st,m)=> st ? st.put(v,k) : (m.set(k,v),{})),
    del:(s,k)=>op(s,'readwrite',(st,m)=> st ? st.delete(k) : (m.delete(k),{})),
    keys:(s)=>op(s,'readonly',(st,m)=> st ? st.getAllKeys() : {result:[...m.keys()]}),
  };
})();

const ahora = () => Date.now();
const toca = r => { if (r) r._mod = ahora(); return r; };   // marca un registro como cambiado
const COLECCIONES = ['galpones','huevos','perdidas','potreros','animales','tratamientos','enfermedades','stock','compradores','pedidos','gastos','usuarios'];
function vacia(){ const o = {_borrados:{}}; COLECCIONES.forEach(c=>o[c]=[]); return o; }
function normalizar(d){ d = d || {}; COLECCIONES.forEach(c=>{ if(!Array.isArray(d[c])) d[c]=[]; }); if(!d._borrados) d._borrados={}; return d; }

let tGuardar = null;
function guardarDB(huboCambio = true){
  if (huboCambio){ META.sucio = true; META.cambios++; }
  clearTimeout(tGuardar);
  tGuardar = setTimeout(async ()=>{
    try { await IDB.set('kv','estado',{DB, CFG}); await IDB.set('kv','meta',{...META}); } catch(e){}
  }, 150);
  pintarSync();
  if (huboCambio) programarSync(2500);
}
async function cargarDB(){
  try {
    const m = await IDB.get('kv','meta'); if (m) Object.assign(META, m);
    const e = await IDB.get('kv','estado');
    if (e && e.DB){ DB = normalizar(e.DB); CFG = e.CFG; }
  } catch(e){}
  if (!DB){ // migración desde la versión anterior (localStorage)
    try { const raw = localStorage.getItem(LS); if (raw){ const o = JSON.parse(raw); DB = normalizar(o.DB); CFG = o.CFG; } } catch(e){}
  }
  if (!DB){ DB = META.gh ? vacia() : normalizar(semilla()); }
  CFG = CFG || {moneda:'₡', tema:'auto', gramosAveDia:110};

}

// ---------- Borrar con lápida ----------
function borrarRegistro(col, id){
  DB[col] = DB[col].filter(r=>r.id!==id);
  (DB._borrados[col] ||= {})[id] = ahora();
}

// ---------- Fusión registro por registro (gana el cambio más reciente) ----------
function fusionar(a, b){
  a = normalizar(a); b = normalizar(b);
  const out = {_borrados:{}};
  const cols = new Set([...Object.keys(a), ...Object.keys(b)].filter(k=>k!=='_borrados' && Array.isArray(a[k]??b[k])));
  cols.forEach(c=>{
    const lap = {...(b._borrados[c]||{})};
    Object.entries(a._borrados[c]||{}).forEach(([id,t])=>{ if(!(lap[id]>=t)) lap[id]=t; });
    if (Object.keys(lap).length) out._borrados[c] = lap;
    const m = new Map();
    (b[c]||[]).forEach(r=>m.set(r.id, r));                            // remoto primero
    (a[c]||[]).forEach(r=>{ const o = m.get(r.id); if (!o || (r._mod||0) > (o._mod||0)) m.set(r.id, r); });
    out[c] = [...m.values()].filter(r => !(lap[r.id] >= (r._mod||0))).sort((x,y)=>String(x.id).localeCompare(String(y.id)));
  });
  return out;
}

// ---------- Base64 seguro para UTF-8 y binarios ----------
function b64DeBytes(u8){ let s=''; for (let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); }
const b64DeTexto = t => b64DeBytes(new TextEncoder().encode(t));
const textoDeB64 = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')), c=>c.charCodeAt(0)));

// ---------- Cliente mínimo de la API de GitHub ----------
class ErrorGH extends Error { constructor(msg, status){ super(msg); this.status = status; } }
async function gh(ruta, opts = {}, crudo = false){
  const g = META.gh; if (!g) throw new ErrorGH('Sin configurar', 0);
  let r;
  try {
    r = await fetch(`https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}${ruta}`, {
      ...opts, cache:'no-store',
      headers:{ 'Authorization':`Bearer ${g.token}`, 'Accept': crudo ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...(opts.body?{'Content-Type':'application/json'}:{}) },
    });
  } catch(e){ throw new ErrorGH('Sin conexión con GitHub', 0); }
  if (!r.ok){
    let msg = `GitHub respondió ${r.status}`;
    if (r.status===401) msg = 'El token no es válido o venció';
    else if (r.status===403) msg = 'El token no tiene permiso de escritura (Contents: Read and write)';
    else if (r.status===404) msg = 'No se encontró el repositorio o el archivo';
    else if (r.status===409 || r.status===422) msg = 'conflicto';
    throw new ErrorGH(msg, r.status);
  }
  return crudo ? r : r.json();
}
const ramaQ = () => `?ref=${encodeURIComponent(META.gh.rama||'main')}`;

async function leerDatos(){
  let j;
  try { j = await gh(`/contents/datos.json${ramaQ()}`); }
  catch(e){ if (e.status===404) return null; throw e; }
  let txt;
  if (j.content && j.encoding==='base64') txt = textoDeB64(j.content);
  else { const b = await gh(`/git/blobs/${j.sha}`); txt = textoDeB64(b.content); }   // archivos > 1 MB
  return { datos: normalizar(JSON.parse(txt)), sha: j.sha };
}
async function escribirDatos(datos, sha){
  const cuerpo = { message:`Sincronización · ${META.gh.dispositivo||'dispositivo'} · ${new Date().toLocaleString('es-CR')}`,
    content: b64DeTexto(JSON.stringify(datos)), branch: META.gh.rama||'main', ...(sha?{sha}:{}) };
  const r = await gh('/contents/datos.json', {method:'PUT', body:JSON.stringify(cuerpo)});
  return r.content.sha;
}
async function subirFotoGH(ruta, blob){
  const u8 = new Uint8Array(await blob.arrayBuffer());
  try {
    await gh(`/contents/${ruta}`, {method:'PUT', body:JSON.stringify({ message:`Foto · ${ruta}`, content:b64DeBytes(u8), branch:META.gh.rama||'main' })});
  } catch(e){ if (e.status===422 || e.status===409) return; throw e; }   // ya existía: listo
}
async function bajarFotoGH(ruta){
  const r = await gh(`/contents/${ruta}${ramaQ()}`, {}, true);
  return await r.blob();
}

const urlsFoto = new Map();
const FOTO_VACIA = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
function fotoTag(src, alt=''){
  if (!src) return '';
  if (src.startsWith('gh:')) return `<img data-foto-src="${esc(src)}" src="${urlsFoto.get(src)||FOTO_VACIA}" alt="${esc(alt)}">`;
  return `<img src="${esc(src)}" alt="${esc(alt)}">`;
}
async function hidratarFotos(raiz = document){
  const imgs = [...raiz.querySelectorAll('img[data-foto-src]')];
  for (const img of imgs){
    const src = img.dataset.fotoSrc; if (urlsFoto.has(src)){ img.src = urlsFoto.get(src); continue; }
    const ruta = src.slice(3);
    try {
      let reg = await IDB.get('fotos', ruta);
      if (!reg && META.gh && navigator.onLine){ const blob = await bajarFotoGH(ruta); reg = {blob, pendiente:false}; await IDB.set('fotos', ruta, reg); }
      if (reg){ const u = URL.createObjectURL(reg.blob); urlsFoto.set(src, u); document.querySelectorAll(`img[data-foto-src="${CSS.escape(src)}"]`).forEach(i=>i.src=u); }
    } catch(e){ /* sin conexión: se intentará luego */ }
  }
}
async function fotosPendientes(){
  const ks = await IDB.keys('fotos'); const out = [];
  for (const k of ks){ const r = await IDB.get('fotos', k); if (r?.pendiente) out.push([k, r]); }
  return out;
}

// ---------- Motor de sincronización ----------
const SYNC = { estado:'local', error:'', corriendo:false, otra:false, pendFotos:0 };
let tSync = null;
function programarSync(ms){ if (!META.gh) return; clearTimeout(tSync); tSync = setTimeout(()=>sincronizar(), ms); }

async function sincronizar({silencioso=true} = {}){
  if (!META.gh){ SYNC.estado='local'; pintarSync(); return; }
  if (!navigator.onLine){ SYNC.estado='offline'; pintarSync(); return; }
  if (SYNC.corriendo){ SYNC.otra = true; return; }
  SYNC.corriendo = true; SYNC.estado = 'sincronizando'; SYNC.error=''; pintarSync();
  const antes = JSON.stringify(DB);
  try {
    // 1) Fotos que se tomaron sin internet
    for (const [ruta, reg] of await fotosPendientes()){
      await subirFotoGH(ruta, reg.blob); reg.pendiente = false; await IDB.set('fotos', ruta, reg);
    }
    // 2) Datos: leer → fusionar → escribir (reintenta si otro dispositivo escribió antes)
    for (let intento = 0; intento < 4; intento++){
      const v = META.cambios;
      const remoto = await leerDatos();
      const fusion = remoto ? fusionar(DB, remoto.datos) : fusionar(DB, vacia());
      const hayQueSubir = !remoto || META.sucio || JSON.stringify(fusion) !== JSON.stringify(remoto.datos);
      if (!hayQueSubir){ DB = fusionar(DB, fusion); META.sha = remoto.sha; break; }
      try {
        META.sha = await escribirDatos(fusion, remoto?.sha);
        DB = fusionar(DB, fusion);
        META.sucio = META.cambios !== v;     // si editaste mientras subía, queda pendiente
        break;
      } catch(e){ if (e.message!=='conflicto' || intento===3) throw e; }
    }
    META.ultima = ahora(); SYNC.estado = 'ok';
  } catch(e){
    SYNC.estado = navigator.onLine ? 'error' : 'offline'; SYNC.error = e.message;
    if (!silencioso) snack(e.message, true);
  } finally {
    SYNC.corriendo = false;
    SYNC.pendFotos = (await fotosPendientes()).length;
    guardarDB(false);
    if (JSON.stringify(DB) !== antes && !FORM) render();       // llegaron cambios de otro dispositivo
    pintarSync();
    if (SYNC.otra){ SYNC.otra = false; programarSync(500); }
  }
}

// Indicador en el encabezado
function textoSync(){
  if (!META.gh) return {i:'💾', t:'Solo este equipo', c:''};
  const pend = (META.sucio?1:0) + SYNC.pendFotos;
  if (SYNC.estado==='sincronizando') return {i:'⟳', t:'Sincronizando…', c:'gira'};
  if (!navigator.onLine || SYNC.estado==='offline') return {i:'☁︎', t: pend ? 'Sin señal · cambios guardados' : 'Sin señal', c:'off'};
  if (SYNC.estado==='error') return {i:'!', t:'Error al sincronizar', c:'err'};
  if (pend) return {i:'↑', t:'Cambios por subir', c:'pend'};
  return {i:'✓', t: META.ultima ? `Al día · ${hace(META.ultima)}` : 'Al día', c:'ok'};
}
function hace(t){ const s = Math.round((ahora()-t)/1000); if (s<60) return 'ahora'; const m=Math.round(s/60); if (m<60) return `hace ${m} min`; const h=Math.round(m/60); return h<24?`hace ${h} h`:`hace ${Math.round(h/24)} d`; }
function pintarSync(){
  const x = textoSync();
  document.querySelectorAll('.syncpill').forEach(el=>{ el.className = `syncpill ${x.c}`; el.innerHTML = `<span class="si">${x.i}</span><span class="tx">${esc(x.t)}</span>`; el.title = x.t; });
}
window.addEventListener('online', ()=>{ pintarSync(); programarSync(800); });
window.addEventListener('offline', ()=>{ SYNC.estado='offline'; pintarSync(); });
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') programarSync(500); });
setInterval(()=>{ if (META.gh && document.visibilityState==='visible') sincronizar(); else pintarSync(); }, 3*60*1000);

// Gráfica de línea en SVG (equivalente a Canvas en Compose)
function lineChart(pts, color, fmt=v=>num(Math.round(v)), completo=false){
  if (!pts.length) return vacio('📉','Sin datos','No hay registros para este período.');
  const vw = window.innerWidth;
  const W = vw<760 ? 340 : (completo || vw<1100 ? 720 : 480), H = vw<760 ? 170 : 230, L=34,R=8,T=12,B=26;
  const max = Math.max(...pts.map(p=>p.v), 1), min = 0;
  const x = i => L + (pts.length===1 ? (W-L-R)/2 : i*(W-L-R)/(pts.length-1));
  const y = v => T + (H-T-B)*(1-(v-min)/(max-min||1));
  const line = pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = `${x(0)},${H-B} ${line} ${x(pts.length-1)},${H-B}`;
  const paso = Math.ceil(pts.length/6);
  const grid = [0,.5,1].map(f=>{const v=min+(max-min)*f; return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--outline)" stroke-dasharray="3 3"/><text class="axis" x="${L-6}" y="${y(v)+3}" text-anchor="end">${v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)}</text>`;}).join('');
  const labels = pts.map((p,i)=> (i%paso===0||i===pts.length-1) ? `<text class="axis" x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(p.l)}</text>`:'').join('');
  const ult = pts[pts.length-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de línea">${grid}
    <polygon class="ar" points="${area}" fill="${color}" fill-opacity=".16"/>
    <polyline class="ln" pathLength="1" points="${line}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="pt" cx="${x(pts.length-1)}" cy="${y(ult.v)}" r="6" fill="${color}" stroke="var(--surface)" stroke-width="2.5"/>${labels}</svg>
    <div class="legend"><span>Último: <b>${fmt(ult.v)}</b></span><span>Máx: <b>${fmt(max)}</b></span><span>Prom: <b>${fmt(pts.reduce((s,p)=>s+p.v,0)/pts.length)}</b></span></div></div>`;
}
function barras(items, color, fmt=num){
  if (!items.length) return vacio('📊','Sin datos','No hay registros para este período.');
  const max = Math.max(...items.map(i=>i.v), 1);
  return `<div class="bars" style="--ac:${color}">${items.map(i=>`<div class="bar"><div class="bl"><span>${esc(i.l)}</span><span>${fmt(i.v)}</span></div><div class="bt"><div class="bf" style="width:${(i.v*100/max).toFixed(1)}%"></div></div></div>`).join('')}</div>`;
}
const agrupar = (lista, kf, vf) => { const m={}; lista.forEach(x=>{ const k=kf(x); m[k]=(m[k]||0)+vf(x); }); return Object.entries(m).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v); };

// ---------------- Alertas para Inicio ----------------
function alertas(){
  const out=[];
  if (puede('GANADERIA')||puede('AVICOLA')){
    DB.tratamientos.filter(t=>t.proxima && (t.proxima<hoy() || diasEntre(hoy(),t.proxima)<=7)).filter(t=> t.especie==='Gallina'?puede('AVICOLA'):puede('GANADERIA')).forEach(t=>{
      const venc=t.proxima<hoy(); const e=espDeValor(t.especie);
      out.push({cls:venc?'bad':'warn', i:'💉', t:`${venc?'Dosis vencida':'Dosis próxima'}: ${t.producto}`, d:`${ESP[e].nombre} · ${t.animal} · ${venc?'desde':'el'} ${fFecha(t.proxima)}`, go:{v:'lista',p:{ent:'tratamientos',esp:e}}});
    });
  }
  if (puede('GANADERIA')){
    DB.animales.filter(a=>a.estado==='Preñada'&&a.servicio).forEach(a=>{ const pt=C.parto(a); const d=diasEntre(hoy(),pt);
      if (d<=30 && d>=-7) out.push({cls:'info', i:ESP[espDeValor(a.especie)].emo, t:`Parto probable: ${a.nombre} (${a.codigo})`, d: d>=0?`En ${d} días · ${fFecha(pt)}`:`Pasada la fecha por ${-d} días`, go:{v:'detalle',p:{ent:'animales',id:a.id}}}); });
    DB.animales.filter(a=>a.sexo==='Hembra'&&C.retiro(a).leche).forEach(a=>{
      out.push({cls:'bad', i:'🥛', t:`No vender leche de ${a.nombre} (${a.codigo})`, d:`Retiro hasta el ${fFecha(C.retiro(a).leche)}`, go:{v:'detalle',p:{ent:'animales',id:a.id}}}); });
  }
  if (puede('STOCK')){
    DB.stock.filter(s=>Number(s.cantidad)<=Number(s.minimo)).forEach(s=>{
      out.push({cls:'warn', i:'📦', t:`Stock bajo: ${s.producto}`, d:`Quedan ${num(s.cantidad)} ${s.unidad} (${ESP[espDeValor(s.area)]?.nombre||s.area})`, go:{v:'lista',p:{ent:'stock',esp:espDeValor(s.area)}}}); });
  }
  return out;
}

// Listado genérico (PantallaCRUD) con búsqueda y filtros
function itemsDe(p){
  const E = ENT[p.ent]; let l = COL(p.ent).slice();
  if (E.ctx && p.esp) l = l.filter(x => x[E.ctx] === ESP[p.esp].valor);
  if (p.ent==='huevos'||p.ent==='perdidas'||p.ent==='pedidos'||p.ent==='gastos'||p.ent==='tratamientos'||p.ent==='enfermedades') l.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  else if (p.ent==='animales') l.sort((a,b)=>a.codigo.localeCompare(b.codigo));
  else l.sort((a,b)=>String(a.nombre||a.producto||'').localeCompare(String(b.nombre||b.producto||'')));
  return l;
}
function filtrar(p, l){
  const E = ENT[p.ent];
  if (S.chip && E.chips) l = l.filter(x => x[E.chips.k] === S.chip);
  const q = S.q.trim().toLowerCase();
  if (q) l = l.filter(x => { const it = E.item(x); return (it.t1+' '+it.t2+' '+Object.values(x).join(' ')).toLowerCase().includes(q); });
  return l;
}
function cuerpoLista(p){
  const E = ENT[p.ent]; const todos = itemsDe(p); const l = filtrar(p, todos);
  const ac = p.esp ? ESP[p.esp].ac : (p.ent==='pedidos'||p.ent==='compradores' ? 'var(--c-venta)' : '');
  if (!l.length) return todos.length ? vacio('🔍','Sin resultados',`Ninguna coincidencia${S.q?` con “${S.q}”`:''}.`) : vacio(E.emo||'📋',`Aún no hay ${E.titulo.toLowerCase()}`,`Toca el botón + para agregar el primer ${E.uno}.`);
  const lim = 80; const vis = l.slice(0, lim);
  return `<div class="list">${vis.map(x=>fila(p.ent,x,ac)).join('')}</div>${l.length>lim?`<div class="note">Mostrando ${lim} de ${l.length}. Usa la búsqueda para encontrar el resto.</div>`:''}`;
}
function cabeceraLista(p){
  const E = ENT[p.ent]; const todos = itemsDe(p);
  let h = '';
  if (E.resumen) h += statStrip(E.resumen(todos).map(s=>({...s, ac: p.esp?ESP[p.esp].ac:(['pedidos','compradores'].includes(p.ent)?'var(--c-venta)':'var(--primary)')})));
  h += `<div class="search">${ic('search')}<input id="q" type="search" placeholder="Buscar ${E.titulo.toLowerCase()}…" value="${esc(S.q)}" autocomplete="off"></div>`;
  if (E.chips){ const vals = E.chips.v.filter(v=>todos.some(x=>x[E.chips.k]===v));
    if (vals.length>1) h += `<div class="chips"><button class="chip ${!S.chip?'on':''}" data-a="chip" data-p="${jp({v:''})}">Todos</button>${vals.map(v=>`<button class="chip ${S.chip===v?'on':''}" data-a="chip" data-p="${jp({v})}">${esc(ROLES[v]?.etq||v)}</button>`).join('')}</div>`; }
  return h;
}

V.reportes = () => {
  const dias = {semana:7, mes:30, todo:9999}[S.periodo];
  const enP = f => diasEntre(f, hoy()) < dias;
  const ped = DB.pedidos.filter(p=>p.estado==='Entregado'&&enP(p.fecha));
  const ing = ped.reduce((s,p)=>s+C.totalPedido(p),0);
  const gas = DB.gastos.filter(g=>enP(g.fecha)).reduce((s,g)=>s+Number(g.monto),0);
  const util = ing-gas;
  let body = `<div class="seg">${[['semana','Semana'],['mes','Mes'],['todo','Todo']].map(([k,l])=>`<button class="${S.periodo===k?'on':''}" data-a="periodo" data-p="${jp({v:k})}">${l}</button>`).join('')}</div>`;
  body += `<div class="grid2 kpi3"><div class="stat accent" style="--ac:var(--ok)"><div class="v">${dineroCorto(ing)}</div><div class="l">Ingresos</div></div><div class="stat accent" style="--ac:var(--danger)"><div class="v">${dineroCorto(gas)}</div><div class="l">Gastos</div></div>
    <div class="stat accent span-movil" style="--ac:${util>=0?'var(--ok)':'var(--danger)'}"><div class="v">${dinero(util)}</div><div class="l">Utilidad del período ${ing?`· margen ${(util*100/ing).toFixed(0)}%`:''}</div></div></div>`;

  // Serie temporal
  let pts;
  const serie = (vf) => {
    if (S.periodo==='todo'){ const meses=[]; for(let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); meses.push(`${d.getFullYear()}-${pad2(d.getMonth()+1)}`); }
      return meses.map(m=>({l:new Date(m+'-15T12:00:00').toLocaleDateString('es-CR',{month:'short'}), v:vf(f=>f.startsWith(m))})); }
    return Array.from({length:dias},(_,i)=>{const f=sumarDias(hoy(),i-dias+1); return {l:fCorta(f), v:vf(x=>x===f)};});
  };
  if (S.grafica==='huevos') pts = serie(m=>DB.huevos.filter(h=>m(h.fecha)).reduce((s,h)=>s+Number(h.cantidad),0));
  else pts = serie(m=>DB.pedidos.filter(p=>p.estado==='Entregado'&&m(p.fecha)).reduce((s,p)=>s+C.totalPedido(p),0) - DB.gastos.filter(g=>m(g.fecha)).reduce((s,g)=>s+Number(g.monto),0));
  body += `<div class="section-title">Tendencia</div><div class="card pad"><div class="seg" style="margin-top:0"><button class="${S.grafica==='huevos'?'on':''}" data-a="grafica" data-p="${jp({v:'huevos'})}">🥚 Huevos</button><button class="${S.grafica==='util'?'on':''}" data-a="grafica" data-p="${jp({v:'util'})}">💰 Utilidad</button></div>
    ${lineChart(pts, S.grafica==='huevos'?'var(--c-gallina)':'var(--ok)', S.grafica==='huevos'?undefined:dineroCorto, true)}</div>`;
  body += `<div class="cols2"><div><div class="section-title">Gastos por categoría</div><div class="card pad">${barras(agrupar(DB.gastos.filter(g=>enP(g.fecha)),g=>g.categoria,g=>Number(g.monto)),'var(--danger)',dineroCorto)}</div></div>`;
  body += `<div><div class="section-title">Ventas por comprador</div><div class="card pad">${barras(agrupar(ped,p=>nombreComprador(p.compradorId),p=>C.totalPedido(p)).slice(0,5),'var(--c-venta)',dineroCorto)}</div></div>`;
  body += `<div><div class="section-title">Pérdidas de aves por causa</div><div class="card pad">${barras(agrupar(DB.perdidas.filter(p=>enP(p.fecha)),p=>p.causa,p=>Number(p.cantidad)),'var(--c-gallina)')}</div></div>`;
  body += `<div><div class="section-title">Gastos por área</div><div class="card pad">${barras(agrupar(DB.gastos.filter(g=>enP(g.fecha)),g=>ESP[espDeValor(g.area)]?.nombre||g.area,g=>Number(g.monto)),'var(--primary)',dineroCorto)}</div></div></div>`;
  body += `<button class="btn tonal block mt" data-a="go" data-p="${jp({v:'lista',p:{ent:'gastos'}})}">💸 Ver y registrar gastos</button>`;
  return {titulo:'Reportes', hero:{kicker:'Finanzas y producción', titulo:'Tus <em>números</em>', escena:'campo'}, body};

// Conteo animado de cifras (0 → valor)
function contar(raiz){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  raiz.querySelectorAll('.stat .v, .hubcard .big b, .tile .cnt').forEach(el=>{
    const m = el.textContent.match(/^([^\d-]*)(-?[\d\s  .,]*\d)(.*)$/); if (!m) return;
    const crudo = m[2].replace(/[\s  ]/g,''); const dec = (crudo.split(',')[1]||'').length;
    const fin = parseFloat(crudo.replace(/\./g,'').replace(',','.')); if (isNaN(fin) || Math.abs(fin) < 2) return;
    const t0 = performance.now(), dur = 900;
    const paso = ahora => { const k = Math.min(1,(ahora-t0)/dur), e = 1-Math.pow(1-k,3);
      el.textContent = m[1] + (fin*e).toLocaleString('es-CR',{minimumFractionDigits:dec,maximumFractionDigits:dec}) + m[3];
      if (k<1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  });
}

function abrirFormulario(ent, x, p={}){
  const E = ENT[ent];
  const ctxVal = E.ctx ? (x ? x[E.ctx] : ESP[p.esp]?.valor) : null;
  if (E.ctx && !ctxVal){ ir('elegirEspecie',{ent}); return; }
  const campos = E.campos({especie:ctxVal});
  FORM = {ent, id:x?.id||null, campos, ctxVal, viejo: x?{...x}:null};
  const val = c => x ? (x[c.k] ?? '') : (p.pre?.[c.k] ?? c.def ?? '');
  const opts = c => (c.op||[]).map(o=>Array.isArray(o)?o:[o,o]);
  const html = campos.map(c=>{
    const v = val(c); let inp;
    if (c.t==='select') inp = `<select name="${c.k}">${!c.req||v===''?'':''}${opts(c).map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
    else if (c.t==='area') inp = `<textarea name="${c.k}">${esc(v)}</textarea>`;
    else inp = `<input name="${c.k}" type="${c.t==='number'?'number':c.t||'text'}" ${c.t==='number'?'inputmode="decimal" step="any" min="0"':''} value="${esc(v)}">`;
    let hint = c.hint==='stock' ? `Disponibles: ${num(C.cartonesDisponibles(x?.id))} cartones` : c.hint;
    return `<div class="field" data-k="${c.k}"><label>${esc(c.l)}${c.req?' *':''}</label>${inp}${hint?`<div class="hint">${esc(hint)}</div>`:''}<div class="err">Este campo es obligatorio</div></div>`;
  }).join('');
  const ctxTxt = ctxVal ? ` · ${ESP[espDeValor(ctxVal)].emo} ${ESP[espDeValor(ctxVal)].nombre}` : '';
  const sh = document.getElementById('sheet');
  sh.innerHTML = `<div class="grab"></div><h2>${x?'Editar':'Nuevo'} ${E.uno}${ctxTxt}</h2><form class="body" id="frm" novalidate>${html}<div class="formerr" id="ferr"></div></form>
    <div class="foot"><button class="btn out" data-a="cerrarForm">Cancelar</button><button class="btn fill" data-a="guardar">${ic('check')}Guardar</button></div>`;
  sh.classList.add('on'); document.getElementById('scrim').classList.add('on');
  document.getElementById('frm').addEventListener('submit', e=>{e.preventDefault(); guardar();});
  setTimeout(()=>sh.querySelector('input,select,textarea')?.focus({preventScroll:true}), 280);
}
function cerrarForm(){ document.getElementById('sheet').classList.remove('on'); document.getElementById('scrim').classList.remove('on'); FORM=null; }
function guardar(){
  if (!FORM || FORM.ent==='_gh') return; const E = ENT[FORM.ent]; const f = document.getElementById('frm');
  const d = {}; let ok = true;
  FORM.campos.forEach(c=>{
    const el = f.elements[c.k]; let v = el.value.trim();
    const box = f.querySelector(`.field[data-k="${c.k}"]`); box.classList.remove('bad');
    if (c.req && v===''){ box.classList.add('bad'); box.querySelector('.err').textContent='Este campo es obligatorio'; ok=false; }
    if (c.t==='number' && v!==''){ v = Number(v); if (isNaN(v) || v<0){ box.classList.add('bad'); box.querySelector('.err').textContent='Ingresa un número válido'; ok=false; } }
    if (c.unico && v && COL(FORM.ent).some(r=>r[c.k]===v && r.id!==FORM.id)){ box.classList.add('bad'); box.querySelector('.err').textContent='Ya existe un registro con este código'; ok=false; }
    d[c.k] = v;
  });
  if (E.ctx) d[E.ctx] = FORM.ctxVal;
  const ferr = document.getElementById('ferr'); ferr.style.display='none';
  if (!ok) return;
  if (E.validar){ const m = E.validar(d, FORM.viejo); if (m){ ferr.textContent = m; ferr.style.display='block'; return; } }
  const lista = COL(FORM.ent);
  if (FORM.id){ const i = lista.findIndex(r=>r.id===FORM.id); E.onSave?.(d, FORM.viejo);
    // al cambiar el código de un animal se actualizan referencias de genealogía
    if (FORM.ent==='animales' && FORM.viejo.codigo!==d.codigo) DB.animales.forEach(a=>{ if(a.madre===FORM.viejo.codigo){a.madre=d.codigo;toca(a);} if(a.padre===FORM.viejo.codigo){a.padre=d.codigo;toca(a);} });
    lista[i] = toca({...lista[i], ...d}); }
  else { E.onSave?.(d, null); lista.push(toca({id:uid(), foto:'', ...d})); }
  guardarDB(); const eraNuevo = !FORM.id; const uno = E.uno; cerrarForm(); render();
  snack(`${uno[0].toUpperCase()+uno.slice(1)} ${eraNuevo?'guardado':'actualizado'}`);
}

// ---------------- Foto (EditorImagen): reduce antes de guardar ----------------
function cargarFoto(id, file){
  if (!file) return; const rd = new FileReader();
  rd.onload = () => { const img = new Image(); img.onload = () => {
      const max = 1024, k = Math.min(1, max/Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(async blob => {
        const a = DB.animales.find(x=>x.id===id); if (!a || !blob) return;
        const ruta = `fotos/${a.codigo.replace(/[^\w-]/g,'_')}-${uid()}.jpg`;
        await IDB.set('fotos', ruta, {blob, pendiente:true});
        urlsFoto.set('gh:'+ruta, URL.createObjectURL(blob));
        a.foto = 'gh:'+ruta; toca(a); SYNC.pendFotos++;
        guardarDB(); render(); snack(navigator.onLine||!META.gh ? 'Foto guardada' : 'Foto guardada · se subirá al tener señal');
      }, 'image/jpeg', .8);
    }; img.onerror = () => snack('No se pudo leer la imagen', true); img.src = rd.result; };
  rd.readAsDataURL(file);
}

// ---------------- Conexión con GitHub (pantalla) ----------------
function abrirConexion(){
  const g = META.gh || {owner:'', repo:'pecuaria-datos', rama:'main', token:'', dispositivo:''};
  const sh = document.getElementById('sheet');
  const campo = (k,l,v,t='text',h='') => `<div class="field" data-k="${k}"><label>${l} *</label><input name="${k}" type="${t}" value="${esc(v)}" autocomplete="off" autocapitalize="off" spellcheck="false">${h?`<div class="hint">${h}</div>`:''}<div class="err">Este campo es obligatorio</div></div>`;
  sh.innerHTML = `<div class="grab"></div><h2>Conectar con GitHub</h2><form class="body" id="frmgh" novalidate>
    <div class="hint" style="margin:0 4px 6px;font-size:13px;line-height:1.5">Los datos se guardan en <b>datos.json</b> y las fotos en la carpeta <b>fotos/</b> de un repositorio <b>privado</b>. Cada dispositivo se conecta una vez.</div>
    ${campo('owner','Usuario u organización de GitHub',g.owner,'text','Ejemplo: andy-dev')}
    ${campo('repo','Repositorio de datos (privado)',g.repo)}
    ${campo('rama','Rama',g.rama||'main')}
    ${campo('token','Token de acceso',g.token,'password','Fine-grained, solo para ese repo, con permiso <b>Contents: Read and write</b>.')}
    ${campo('dispositivo','Nombre de este dispositivo',g.dispositivo,'text','Aparece en el historial de cambios. Ejemplo: Teléfono de Andy')}
    <div class="formerr" id="ferr"></div></form>
    <div class="foot"><button class="btn out" data-a="cerrarForm">Cancelar</button><button class="btn fill" data-a="conectarGH" id="btngh">${ic('check')}Conectar</button></div>`;
  sh.classList.add('on'); document.getElementById('scrim').classList.add('on');
  FORM = {ent:'_gh', campos:[]};
  document.getElementById('frmgh').addEventListener('submit', e=>{ e.preventDefault(); accionConectar(); });
}
async function accionConectar(){
  const f = document.getElementById('frmgh'); const d = {}; let ok = true;
  ['owner','repo','rama','token','dispositivo'].forEach(k=>{ const v=f.elements[k].value.trim(); const box=f.querySelector(`.field[data-k="${k}"]`); box.classList.toggle('bad', !v); if(!v) ok=false; d[k]=v; });
  const ferr = document.getElementById('ferr'); ferr.style.display='none';
  if (!ok) return;
  if (!navigator.onLine){ ferr.textContent='Necesitas internet para conectar el dispositivo la primera vez.'; ferr.style.display='block'; return; }
  const btn = document.getElementById('btngh'); btn.disabled = true; btn.textContent = 'Conectando…';
  try {
    const remoto = await conectarGitHub(d);
    cerrarForm();
    if (remoto){
      const n = COLECCIONES.reduce((s,c)=>s+remoto.datos[c].length,0);
      elegir('Encontramos datos en GitHub', `El repositorio ya tiene ${num(n)} registros. Este dispositivo los descargará y reemplazará los datos que tenga ahora.`, [
        {l:'Cancelar', cls:'out', fn:()=>{ META.gh=null; guardarDB(false); render(); }},
        {l:'Descargar', cls:'fill', fn:async ()=>{ DB = remoto.datos; META.sha = remoto.sha; META.sucio=false; META.ultima=ahora(); await limpiarFotosPendientes(); guardarDB(false); render(true); sincronizar(); snack('Dispositivo conectado'); }},
      ]);
    } else {
      elegir('El repositorio está vacío', '¿Con qué datos quieres empezar? Lo que elijas se subirá a GitHub y lo verán los demás dispositivos.', [
        {l:'Empezar vacío', cls:'out', fn:async ()=>{ DB = vacia(); await limpiarFotosPendientes(); guardarDB(); render(true); sincronizar({silencioso:false}); snack('Conectado · empezando en blanco'); }},
        {l:'Subir los datos actuales', cls:'fill', fn:()=>{ guardarDB(); render(true); sincronizar({silencioso:false}); snack('Conectado · subiendo datos'); }},
      ]);
    }
  } catch(e){
    btn.disabled = false; btn.innerHTML = `${ic('check')}Conectar`;
    ferr.textContent = e.message==='conflicto' ? 'GitHub rechazó la operación. Revisa la rama.' : e.message; ferr.style.display='block';
  }
}
async function limpiarFotosPendientes(){ for (const [k] of await fotosPendientes()) await IDB.del('fotos', k); SYNC.pendFotos = 0; }

// Diálogo con varias opciones
let OPS = [];
function elegir(titulo, texto, ops){
  OPS = ops; const d=document.getElementById('dialog');
  d.innerHTML=`<h3>${esc(titulo)}</h3><p>${esc(texto)}</p><div class="btnrow">${ops.map((o,i)=>`<button class="btn ${o.cls||'out'}" data-a="opDialogo" data-p="${jp({i})}">${esc(o.l)}</button>`).join('')}</div>`;
  d.classList.add('on'); document.getElementById('scrim').classList.add('on');
}

// ---------------- Acciones ----------------
const A = {
  rol:({v})=>{ S.rol=v; META.rol=v; guardarDB(false); S.tab='inicio'; S.pila=[]; render(true); },
  logout:()=>{ S.rol=null; META.rol=''; guardarDB(false); S.pila=[]; render(true); },
  tab:({v})=>tab(v), back:()=>atras(),
  go:({v,p})=>ir(v,p),
  abrir:({ent,id})=>{ ir('detalle',{ent,id}); },
  nuevo:(p)=>abrirFormulario(p.ent, null, p),
  nuevoDesde:(p)=>{ S.pila.pop(); render(); abrirFormulario(p.ent, null, p); },
  editar:({ent,id})=>abrirFormulario(ent, COL(ent).find(r=>r.id===id)),
  eliminar:({ent,id})=>{ const E=ENT[ent]; const x=COL(ent).find(r=>r.id===id);
    confirmar(`¿Eliminar este ${E.uno}?`, `Se eliminará “${E.item(x).t1}”. Esta acción no se puede deshacer.`, ()=>{
      borrarRegistro(ent, id);
      if (ent==='perdidas'){ const g=DB.galpones.find(g=>g.id===x.galponId); if(g){ g.aves=Number(g.aves)+Number(x.cantidad); toca(g); } }
      guardarDB(); cerrarDialogo(); atras(); snack(`${E.uno[0].toUpperCase()+E.uno.slice(1)} eliminado`); }); },
  estadoPedido:({id,e})=>{ const p=DB.pedidos.find(x=>x.id===id); p.estado=e; toca(p); guardarDB(); render(); snack(`Pedido ${e.toLowerCase()}`); },
  chip:({v})=>{ S.chip=v; render(); },
  seg:({v})=>{ S.ventas=v; S.q=''; S.chip=''; render(); },
  periodo:({v})=>{ S.periodo=v; render(); },
  grafica:({v})=>{ S.grafica=v; render(); },
  tema:({v})=>{ CFG.tema=v; guardarDB(false); render(); },
  temaRapido:()=>{ CFG.tema = temaEfectivo()==='dark'?'light':'dark'; guardarDB(false); render(); },
  moneda:({v})=>{ CFG.moneda=v; guardarDB(false); render(); snack(`Moneda: ${v}`); },
  reset:()=>confirmar('¿Restablecer datos?','Se borrarán los cambios hechos en este navegador y se cargarán los datos de ejemplo.',()=>{ DB=normalizar(semilla()); guardarDB(); cerrarDialogo(); render(true); snack('Datos de demostración restablecidos'); },'Restablecer'),
  cerrarForm, guardar, cerrarDialogo,
  sync:()=>{ if (!META.gh){ tab('mas'); return; } if (!navigator.onLine){ snack('Sin señal. Tus cambios están guardados en este dispositivo y se subirán solos.'); return; } sincronizar({silencioso:false}); },
  abrirGH:()=>abrirConexion(),
  conectarGH:()=>accionConectar(),
  desconectarGH:()=>confirmar('¿Desconectar este dispositivo?', (META.sucio||SYNC.pendFotos) ? 'Hay cambios que todavía no se subieron a GitHub y se quedarían solo aquí.' : 'Los datos se quedan en este dispositivo, pero dejará de sincronizarse.', ()=>{ META.gh=null; SYNC.estado='local'; guardarDB(false); cerrarDialogo(); render(); snack('Dispositivo desconectado'); }, 'Desconectar'),
  opDialogo:({i})=>{ const o=OPS[i]; cerrarDialogo(); o?.fn?.(); },
  okDialogo:()=>onOk?.(),
};
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-a]'); if (!t) return;
  const fn = A[t.dataset.a]; if (!fn) return;
  e.preventDefault(); fn(t.dataset.p ? JSON.parse(t.dataset.p) : {});
});
document.getElementById('scrim').addEventListener('click', ()=>{ if (document.getElementById('dialog').classList.contains('on')) cerrarDialogo(); else cerrarForm(); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape'){ if (document.getElementById('dialog').classList.contains('on')) cerrarDialogo(); else if (FORM) cerrarForm(); } });

(async () => {
  await cargarDB(); render(true);
  if (META.gh) sincronizar();
  if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
    try { navigator.serviceWorker.register('./sw.js').catch(()=>{}); } catch(e){}
  }
})();
</script>
